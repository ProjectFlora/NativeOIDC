name: Setup Xcode
description: |-
  Selects the Xcode a job builds with. `mode: pinned` (the default) selects
  the `version` input via maxim-lobanov/setup-xcode; `mode: latest` selects
  the newest installed stable Xcode (the CI `latest` iOS lane). One source
  of truth for the release Xcode pin; where it lives and how to change it:
  docs/ci-toolchains.md.
inputs:
  mode:
    description: |-
      `pinned` selects the `version` input (the release pipeline and the
      release consumer validation). `latest` selects the newest installed
      stable Xcode on the runner (the `latest` iOS lane of ci.yml, on the
      `xcode-27` preview runner).
    default: pinned
  version:
    description: |-
      The Xcode version for `mode: pinned`. App Store Connect requires apps
      built with Xcode 26 or later (Issue #135), so the release pipeline
      builds and validates with a stable Xcode 26.x — the one the macos-26
      image ships as its default, so no extra download. `release.yml` and
      `release-consumer.yml` use this same default, so the pin lives in
      this one place.
    default: '26.6'
runs:
  using: composite
  steps:
    - name: Select the pinned Xcode
      if: ${{ inputs.mode == 'pinned' }}
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.version }}
    # The newest installed stable Xcode (the step the `latest` iOS lane of
    # ci.yml ran inline before the setup blocks were consolidated): the
    # preview runner ships no default selection the lane can rely on, so it
    # picks the newest versioned installation itself.
    - name: Select the newest installed stable Xcode
      if: ${{ inputs.mode == 'latest' }}
      run: |
        developer_dir=$(python3 - <<'PY'
        import glob
        import re
        candidates = []
        for path in glob.glob('/Applications/Xcode*.app'):
            match = re.fullmatch(r'/Applications/Xcode_(\d+(?:\.\d+)*)\.app', path)
            if match:
                candidates.append((tuple(map(int, match[1].split('.'))), path))
        if not candidates:
            raise SystemExit('No stable versioned Xcode installation found')
        print(max(candidates)[1] + '/Contents/Developer')
        PY
        )
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      shell: bash
