name: Setup Xcode
description: |-
  Selects the Xcode a job builds with, via maxim-lobanov/setup-xcode. The
  `version` input is a semver version or range: an exact version (the
  release pipeline's 26.6 pin) or a bare major (the ci.yml Apple lanes pass
  their series — 26, 27 — to select the newest installed stable of that
  series, #284). The step fails when no installed Xcode matches; nothing is
  downloaded. Where the pins live and how to change them:
  docs/ci-toolchains.md.
inputs:
  version:
    description: |-
      The Xcode version to select. App Store Connect requires apps built
      with Xcode 26 or later (Issue #135), so the release pipeline builds
      and validates with a stable Xcode 26.x — the one the macos-26 image
      ships as its default, so no extra download. `release.yml` and
      `release-consumer.yml` use this same default, so the pin lives in
      this one place. The ci.yml Apple lanes pass their stable major
      (#284).
    default: '26.6'
runs:
  using: composite
  steps:
    # The spec resolves with semver: an exact version matches itself, a bare
    # major the newest installed stable of that series. maxim-lobanov
    # setup-xcode fails the step when no installed Xcode matches (it never
    # downloads one), which is the deliberate tripwire for a runner image
    # that no longer ships the lane's Xcode series.
    - name: Select the Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.version }}
