name: Rust CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which jobs this change needs (docs/ci-job-selection.md). Each job
  # below is skipped only when this job succeeded and set its output to
  # 'false'; a failed selection runs everything instead of skipping it.
  changes:
    name: Select CI jobs
    runs-on: ubuntu-latest
    outputs:
      msrv: ${{ steps.select.outputs.msrv }}
      test: ${{ steps.select.outputs.test }}
      lint: ${{ steps.select.outputs.lint }}
      coverage: ${{ steps.select.outputs.coverage }}
      licenses: ${{ steps.select.outputs.licenses }}
      spm_bindings: ${{ steps.select.outputs.spm_bindings }}
      spm_manifest: ${{ steps.select.outputs.spm_manifest }}
      apple: ${{ steps.select.outputs.apple }}
      android: ${{ steps.select.outputs.android }}
      windows: ${{ steps.select.outputs.windows }}
      report: ${{ steps.select.outputs.report }}
    steps:
      # Full history: a push is compared with the commit it replaced, which
      # may be several commits back.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        run: python3 scripts/select_ci_jobs.py select

  msrv:
    name: MSRV
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.msrv != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.99.1

  test:
    name: Tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.test != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

  licenses:
    name: Dependency licenses
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.licenses != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
      - name: Setup Cargo Tools
        uses: ./.github/actions/setup-cargo-tools
        with:
          tools: cargo-deny@0.20.2,cargo-about@0.9.3

  apple_adapters:
    name: Apple adapters validation (iOS ${{ matrix.ios_simulator }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.apple != 'false') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios_simulator: '18'
            runner: macos-15
          - ios_simulator: latest
            runner: xcode-27
    env:
      IOS_SIMULATOR_MAJOR_VERSION: ${{ matrix.ios_simulator }}
    steps:
      - uses: actions/checkout@v7
      - name: Select newest installed Xcode for latest iOS
        if: matrix.ios_simulator == 'latest'
        run: |
          developer_dir=$(python3 - <<'PY'
          import glob
          import re
          candidates = []
          for path in glob.glob('/Applications/Xcode*.app'):
              match = re.fullmatch(r'/Applications/Xcode_(\d+(?:\.\d+)*)\.app', path)
              if match:
                  candidates.append((tuple(map(int, match[1].split('.'))), path))
          if not candidates:
              raise SystemExit('No stable versioned Xcode installation found')
          print(max(candidates)[1] + '/Contents/Developer')
          PY
          )
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

  spm_bindings:
    name: Swift package bindings match
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.spm_bindings != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

  spm_manifest:
    name: Swift package manifest is consistent
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.spm_manifest != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

  windows_core:
    name: Windows core target validation
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.windows != 'false') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

  android_adapters:
    name: Android adapters validation
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Android
        uses: ./.github/actions/setup-android
        with:
          ndk: 27.2.12479018
          packages: platform-tools
          compile-sdk: android-35
          build-tools: 35.0.0
          api-level: 28
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

  lint:
    name: Formatting and Clippy
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lint != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain with components
        uses: ./.github/actions/setup-rust-toolchain
        with:
          components: clippy, rustfmt

  coverage:
    name: Coverage
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.coverage != 'false') }}
    outputs:
      line_coverage: ${{ steps.coverage_summary.outputs.line_coverage }}
      function_coverage: ${{ steps.coverage_summary.outputs.function_coverage }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain with components
        uses: ./.github/actions/setup-rust-toolchain
        with:
          components: llvm-tools-preview
      - name: Setup Cargo Tools
        uses: ./.github/actions/setup-cargo-tools
        with:
          tools: cargo-llvm-cov@0.9.2

  # One check for the whole run: it passes only when every job passed or was
  # skipped because the selection left it out, and names each job that
  # failed, was cancelled, or was skipped although selected.
  ci_result:
    name: CI result
    needs: [changes, msrv, test, licenses, apple_adapters, spm_bindings, spm_manifest, android_adapters, windows_core, windows_client, lint, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

  # GITHUB_TOKEN is write-enabled only for same-repository PRs; fork PRs keep read-only checks.
  report:
    name: PR report
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [changes, msrv, test, licenses, apple_adapters, spm_bindings, spm_manifest, android_adapters, windows_core, windows_client, lint, coverage]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          SELECTION_REPORT: ${{ needs.changes.outputs.report }}
        with:
          script: |
            const marker = '<!-- native-oidc-ci-report -->';
            // [check, result, selection output]; a skip is intended only when
            // the selection succeeded and set that output to 'false'.
            const selectionKnown = '${{ needs.changes.result }}' === 'success';
            const checks = [
              ['MSRV', '${{ needs.msrv.result }}', '${{ needs.changes.outputs.msrv }}'],
              ['Tests', '${{ needs.test.result }}', '${{ needs.changes.outputs.test }}'],
              ['Dependency licenses', '${{ needs.licenses.result }}', '${{ needs.changes.outputs.licenses }}'],
              ['Apple adapters validation', '${{ needs.apple_adapters.result }}', '${{ needs.changes.outputs.apple }}'],
              ['Swift package bindings match', '${{ needs.spm_bindings.result }}', '${{ needs.changes.outputs.spm_bindings }}'],
              ['Swift package manifest is consistent', '${{ needs.spm_manifest.result }}', '${{ needs.changes.outputs.spm_manifest }}'],
              ['Android adapters validation', '${{ needs.android_adapters.result }}', '${{ needs.changes.outputs.android }}'],
              ['Windows core target validation', '${{ needs.windows_core.result }}', '${{ needs.changes.outputs.windows }}'],
              ['Windows 11 client consumers (x64 emulation)', '${{ needs.windows_client.result }}', '${{ needs.changes.outputs.windows }}'],
              ['Formatting and Clippy', '${{ needs.lint.result }}', '${{ needs.changes.outputs.lint }}'],
            ];
            const resultLabel = (result, selected) =>
              result === 'success' ? '? passed' :
              result === 'failure' ? '? failed' :
              result === 'skipped' && selectionKnown && selected === 'false' ? '?? skipped (not affected)' :
              `?? ${result}`;
            const coverageResult = '${{ needs.coverage.result }}';
            const coverageSelected = '${{ needs.changes.outputs.coverage }}';
            const formatCoverage = value =>
              /^\d{1,3}(?:\.\d+)?%$/.test(value) ? value : 'unavailable';
            const lineCoverage = formatCoverage('${{ needs.coverage.outputs.line_coverage }}');
            const functionCoverage = formatCoverage('${{ needs.coverage.outputs.function_coverage }}');
            const { owner, repo } = context.repo;
            const body = [
              marker,
              '### CI results',
              '',
              '| Check | Result |',
              '| --- | --- |',
              ...checks.map(([name, result, selected]) => `| ${name} | ${resultLabel(result, selected)} |`),
              `| Coverage | ${resultLabel(coverageResult, coverageSelected)} ? lines ${lineCoverage}, functions ${functionCoverage} |`,
              '',
              selectionKnown && process.env.SELECTION_REPORT
                ? process.env.SELECTION_REPORT
                : `?? Job selection ${'${{ needs.changes.result }}'}: every job was required to run.`,
              '',
              `[View workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
